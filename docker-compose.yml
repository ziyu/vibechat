version: '3.8'

services:
  # TanStack Start app
  vibechat-web:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
    image: vibechat-web
    container_name: vibechat-web
    ports:
      - "7001:7001"
    env_file:
      - .env
    restart: unless-stopped

# Usage:
# Start:            docker-compose up -d
# Stop:             docker-compose down
# Logs:             docker-compose logs -f
# Rebuild:          docker-compose up -d --build
