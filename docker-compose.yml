services:
  # TanStack Start app
  vibechat-web:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
    image: vibechat-web
    container_name: vibechat-web
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # One-time local Synapse key/config generation. Run with `npm run matrix:dev:init`.
  synapse-init:
    image: ghcr.io/element-hq/synapse:v1.157.0
    profiles: ["matrix-init"]
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - ./docker-volumes/synapse:/data
    command: generate

  # Opt-in local Matrix homeserver. It is not started by the default compose profile.
  synapse:
    image: ghcr.io/element-hq/synapse:v1.157.0
    profiles: ["matrix"]
    container_name: vibechat-synapse
    ports:
      - "8008:8008"
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    volumes:
      - ./docker-volumes/synapse:/data
      - ./infra/synapse/homeserver.yaml:/config/homeserver.yaml:ro
      - ./infra/synapse/vibechat-appservice.yaml:/config/vibechat-appservice.yaml:ro
      - ./infra/synapse/log.config:/config/log.config:ro
    restart: unless-stopped

# Usage:
# Start:            docker-compose up -d
# Stop:             docker-compose down
# Logs:             docker-compose logs -f
# Rebuild:          docker-compose up -d --build
# Matrix init:      npm run matrix:dev:init
# Matrix start:     npm run matrix:dev:up
# Matrix stop:      npm run matrix:dev:down
