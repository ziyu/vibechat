name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Use the project's supported Node.js 22 LTS line.
          node-version: '22.x'
          cache: 'pnpm'

      - name: Cache TurboRepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          BUILD_TIME: true

      - name: Build TanStack Start app
        run: NODE_OPTIONS="--max-old-space-size=4096" pnpm build
        env:
          NODE_ENV: production
          BUILD_TIME: true

      - name: Build Docs app
        run: pnpm build:docs
        env:
          NODE_ENV: production

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    # Run on both PRs and pushes to catch Docker-specific issues early
    # Docker environment differs from native CI (pnpm hoisting, file structure, etc.)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file if missing
        run: |
          if [ ! -f .env ]; then
            cp env.example .env 2>/dev/null || echo "BUILD_TIME=true" > .env
          fi

      - name: Build TanStack Start Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web-app/Dockerfile
          platforms: linux/amd64
          push: false
          tags: vibechat-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TIME=true
          shm-size: 2g
